<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Draft Assistant — Two Leagues</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c2230; --line:#2a3140;
    --txt:#e6edf3; --dim:#8b949e; --accent:#3fb950; --accent2:#58a6ff;
    --warn:#f0883e; --danger:#f85149; --gold:#e3b341;
    --qb:#d29922; --rb:#3fb950; --wr:#58a6ff; --te:#db61a2; --k:#a371f7; --dst:#6e7681;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  h1,h2,h3{margin:0}
  .wrap{max-width:1320px;margin:0 auto;padding:14px}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tab{padding:9px 16px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--dim);cursor:pointer;font-size:13px;font-weight:700}
  .tab:hover{border-color:var(--accent2)}
  .tab.active{background:var(--panel2);color:var(--txt);border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset}
  .tab small{display:block;font-weight:400;color:var(--dim);font-size:10px}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}
  header h1{font-size:18px;font-weight:700}
  header .sub{color:var(--dim);font-size:12px}
  .settings{display:flex;flex-wrap:wrap;gap:10px;margin-left:auto;align-items:center}
  .settings label{font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:3px}
  .settings input{width:60px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 7px;font-size:13px}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:12px}
  .btn:hover{border-color:var(--accent2)}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger)}
  .grid{display:grid;grid-template-columns:360px 1fr;gap:14px}
  @media(max-width:980px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:10px}
  .rec-main{background:linear-gradient(135deg,#132a1a,#0f1f2e);border:1px solid #2f6f3e}
  .rec-pickno{font-size:12px;color:var(--dim);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
  .rec-player{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .rec-player .nm{font-size:22px;font-weight:800}
  .rec-player .meta{color:var(--dim);font-size:13px}
  .rec-why{margin-top:8px;font-size:13px;color:#cbd5e1}
  .rec-why b{color:var(--accent)}
  .verdict{margin-top:9px;font-size:13px;font-weight:700;padding:7px 10px;border-radius:7px;border:1px solid var(--line)}
  .verdict.now{background:rgba(248,81,73,.12);border-color:var(--danger);color:#ffb3ae}
  .verdict.wait{background:rgba(63,185,80,.12);border-color:var(--accent);color:#a7e6b4}
  .verdict.ok{background:rgba(88,166,255,.10);border-color:var(--accent2);color:#bcd9ff}
  .strat{margin-top:10px;font-size:12px;color:var(--dim);border-top:1px dashed var(--line);padding-top:8px}
  .rec-actions{margin-top:10px;display:flex;gap:8px}
  .runalert{margin:0 0 12px;padding:9px 12px;border-radius:8px;background:rgba(240,136,62,.12);border:1px solid var(--warn);color:#ffc59a;font-size:13px;font-weight:600;display:none}
  .alt{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
  .alt:first-child{border-top:none}
  .alt .rk{color:var(--dim);width:40px;font-size:11px}
  .alt .nm{font-weight:600}
  .alt .why{color:var(--dim);font-size:11px;margin-left:auto;text-align:right;max-width:200px}
  .pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700;color:#0e1117}
  .pill.QB{background:var(--qb)} .pill.RB{background:var(--rb)} .pill.WR{background:var(--wr)} .pill.TE{background:var(--te)}
  .pill.K{background:var(--k);color:#fff} .pill.DST{background:var(--dst);color:#fff}
  .scar{display:flex;flex-direction:column;gap:5px}
  .scarrow{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;font-size:12px;cursor:pointer}
  .scarrow:hover{border-color:var(--accent2)}
  .scarrow .pos{width:34px;font-weight:700}
  .scarrow .nm{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .scarrow .urg{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
  .urg.hi{background:rgba(248,81,73,.2);color:#ffb3ae}
  .urg.md{background:rgba(240,136,62,.18);color:#ffc59a}
  .urg.lo{background:rgba(139,148,158,.15);color:var(--dim)}
  .prio{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .prio .p{padding:5px 9px;border-radius:6px;border:1px solid var(--line);font-size:12px;font-weight:700}
  .prio .p small{display:block;font-weight:400;color:var(--dim);font-size:10px}
  .prio .p.need{border-color:var(--accent);color:var(--accent)}
  .prio .p.full{opacity:.5}
  #rosterBox{display:flex;flex-direction:column;gap:5px;font-size:13px}
  .rslot{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px}
  .rslot .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .rslot .val{font-weight:600}
  .rslot .val.empty{color:var(--dim);font-weight:400;font-style:italic}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;font-size:12px}
  thead th:hover{color:var(--accent2)}
  thead th.num,tbody td.num{text-align:right}
  tbody td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr:hover{background:var(--panel2)}
  tbody tr.mine{background:rgba(63,185,80,.08)}
  tbody tr.cliff td{border-top:2px solid var(--gold)}
  .tierchip{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:5px}
  .tags{display:flex;gap:4px;flex-wrap:wrap}
  .tag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:0 6px}
  .tag.risk{color:var(--warn);border-color:var(--warn)}
  .tag.safe{color:var(--accent);border-color:var(--accent)}
  .tag.val{color:var(--accent);border-color:var(--accent)}
  .tag.reach{color:var(--danger);border-color:var(--danger)}
  .tag.cliff{color:var(--gold);border-color:var(--gold)}
  .minibtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:3px 8px;cursor:pointer;font-size:11px}
  .minibtn.mine:hover{border-color:var(--accent);color:var(--accent)}
  .minibtn.gone:hover{border-color:var(--danger);color:var(--danger)}
  .minibtn.undo:hover{border-color:var(--accent2);color:var(--accent2)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  .toolbar input[type=text]{flex:1;min-width:140px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 9px;font-size:13px}
  .toolbar select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 9px;font-size:13px}
  .tablewrap{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .foot{color:var(--dim);font-size:11px;margin-top:14px;text-align:center}
  .count{color:var(--dim);font-size:11px;margin-left:auto}
  .legend{color:var(--dim);font-size:11px;margin-top:6px}

  .modebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .modebtn{padding:7px 13px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--dim);cursor:pointer;font-size:12px;font-weight:700}
  .modebtn.active{background:var(--panel2);color:var(--txt);border-color:var(--accent2)}
  .mockbar{display:flex;align-items:center;gap:10px;margin-left:6px;flex-wrap:wrap}
  .mockbar label{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .mockbar input{width:60px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 7px;font-size:13px}
  .mockhint{font-size:11px;color:var(--dim)}
  .clockbar{display:none;margin-bottom:12px;padding:10px 12px;border-radius:8px;background:rgba(88,166,255,.10);border:1px solid var(--accent2);color:#cfe4ff;font-size:13px}
  .clocklog{margin-top:6px;font-size:11px;color:var(--dim)}
  .results h2{font-size:14px;margin-bottom:10px}
  .gradegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
  .gradecard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px}
  .gradecard.you{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .gc-top{display:flex;align-items:center;gap:6px}
  .gc-place{color:var(--dim);font-size:11px}
  .gc-team{font-weight:700;flex:1}
  .gc-grade{font-weight:800;font-size:16px;color:var(--gold)}
  .gc-pts{font-size:12px;color:var(--accent)}
  .gc-top3{font-size:11px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gc-note{font-size:11px;color:var(--warn);margin-top:3px;min-height:1px}
  .mylineup{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .mylineup .lu{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .lup{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:12px}
  .lup small{color:var(--dim)}
  .teamtag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <header>
    <div>
      <h1 id="hTitle"></h1>
      <div class="sub" id="hSub"></div>
    </div>
    <div class="settings">
      <label>Teams<input id="setTeams" type="number" min="4" max="32"/></label>
      <label>My slot<input id="setSlot" type="number" min="1" max="32"/></label>
      <button class="btn" id="undoLastBtn">Undo last</button>
      <button class="btn danger" id="resetBtn">Reset</button>
    </div>
  </header>

  <div id="syncBar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0;padding:8px 12px;border:1px solid #2a3040;border-radius:10px;background:#141924;font-size:13px;color:#c7ccd6;">
    <strong style="color:#e8eaed;">☁ Cloud sync</strong>
    <input id="syncCode" type="text" placeholder="private sync code (10+ chars)" autocomplete="off" spellcheck="false" style="flex:0 1 240px;padding:6px 9px;border-radius:7px;border:1px solid #39404d;background:#0e131b;color:#e8eaed;font-size:13px;"/>
    <button class="btn" id="syncSaveBtn">Link this device</button>
    <button class="btn" id="syncPullBtn" title="Pull the latest from the cloud">↻ Refresh</button>
    <span id="syncStatus" style="opacity:.85;margin-left:2px;"></span>
  </div>

  <div class="runalert" id="runAlert"></div>

  <div class="modebar">
    <button class="modebtn" id="mAssist">Draft Assistant</button>
    <button class="modebtn" id="mMock">Mock Draft</button>
    <div class="mockbar" id="mockBar" style="display:none">
      <label>My draft slot <input id="mockSlot" type="number" min="1" value="1"/></label>
      <span class="mockhint" id="mockSlotMax">1–10</span>
      <button class="btn" id="startMockBtn">Start mock draft</button>
    </div>
  </div>
  <div class="clockbar" id="clockBar"></div>
  <div class="panel results" id="results" style="display:none"></div>

  <div class="grid">
    <div class="left">
      <div class="panel rec-main">
        <div class="rec-pickno"><span id="recPick">Your pick</span><span id="pickCount"></span></div>
        <div id="recBody"></div>
        <div class="verdict" id="verdict" style="display:none"></div>
        <div class="strat" id="stratNote"></div>
      </div>
      <div class="panel">
        <h2>Best available &amp; scarcity</h2>
        <div class="scar" id="scarBox"></div>
        <div class="prio" id="prioBox"></div>
      </div>
      <div class="panel">
        <h2>My roster</h2>
        <div id="rosterBox"></div>
      </div>
      <div class="panel">
        <h2>Next up (smart alternates)</h2>
        <div id="altBox"></div>
      </div>
    </div>
    <div class="right">
      <div class="panel">
        <div class="toolbar">
          <input id="search" type="text" placeholder="Search player or team…"/>
          <select id="posFilter"></select>
          <label style="font-size:12px;color:var(--dim);display:flex;align-items:center;gap:5px">
            <input type="checkbox" id="hideGone" checked/> Hide drafted
          </label>
          <span class="count" id="countLbl"></span>
        </div>
        <div class="tablewrap">
          <table>
            <thead>
              <tr>
                <th>Draft</th>
                <th data-sort="rank" class="num">#</th>
                <th data-sort="name">Player</th>
                <th data-sort="pos">Pos</th>
                <th data-sort="team">Tm</th>
                <th data-sort="bye" class="num">Bye</th>
                <th data-sort="fps" class="num">FPS</th>
                <th data-sort="vorp" class="num">VORP</th>
                <th data-sort="adp" class="num">ADP</th>
                <th data-sort="posrk">PosRk</th>
                <th>Signals</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="legend">Signals: <span class="tag val">Value</span> falls past its value vs market ADP · <span class="tag reach">Reach</span> going earlier than value · <span class="tag cliff">Cliff</span> last of its tier · plus risk tags. Gold line = tier break.</div>
      </div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

           blurb:"Shallow starters, deep 7-man bench, rich waiver wire. Hammer elite RB/WR early and ride tier cliffs; QB & TE are streamable so wait unless there's an elite-tier value. K & DEF only in your last 1–2 rounds. Use the deep bench for upside swings and handcuffs, and chase players falling past their market ADP."}
  }
};

let L, state, P={};
function activeKey(){ try{return localStorage.getItem("draft_active_league")||"guillotine";}catch(e){return "guillotine";} }
function setActiveKey(k){ try{localStorage.setItem("draft_active_league",k);}catch(e){} }
function defaultState(){ return {picks:[],teams:L.teams,slot:1,sortKey:"rank",sortDir:1}; }
function migrate(s){
  if(!s) return null;
  if(!s.picks){ s.picks=[]; (s.mine||[]).forEach(r=>s.picks.push({r,m:true})); (s.gone||[]).forEach(r=>s.picks.push({r,m:false})); }
  delete s.mine; delete s.gone; return s;
}
function loadState(){ try{const s=migrate(JSON.parse(localStorage.getItem(L.storage))); state=s?Object.assign(defaultState(),s):defaultState();}catch(e){state=defaultState();} }
function saveLocalOnly(){ try{localStorage.setItem(L.storage,JSON.stringify(state));}catch(e){} }
function saveState(){ state.__ts=Date.now(); saveLocalOnly(); scheduleCloudPush(); }
/* ---- Cloud sync (cross-device) ---- */
const SYNC_URL="https://ff-draft-sync.mr-twills.workers.dev";
function syncCode(){ try{return (localStorage.getItem("draft_sync_code")||"").trim();}catch(e){return "";} }
function syncOn(){ return SYNC_URL.indexOf("http")===0 && syncCode().length>=10; }
function cloudKey(){ return syncCode()+"::"+(L?L.storage:"g"); }
let _pushT=null;
function syncStatus(m){ var el=document.getElementById("syncStatus"); if(el) el.textContent=m; }
function scheduleCloudPush(){ if(!syncOn()) return; clearTimeout(_pushT); _pushT=setTimeout(cloudPush,700); }
function cloudPush(){
  if(!syncOn()) return;
  syncStatus("saving…");
  fetch(SYNC_URL+"/?key="+encodeURIComponent(cloudKey()),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({ts:state.__ts||Date.now(),state:state})})
    .then(function(r){ syncStatus(r.ok?("synced ✓ "+new Date().toLocaleTimeString()):"sync error"); })
    .catch(function(){ syncStatus("offline — will retry"); });
}
function cloudPull(){
  if(!syncOn()) return;
  syncStatus("checking…");
  fetch(SYNC_URL+"/?key="+encodeURIComponent(cloudKey()))
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){
      if(j && j.state && Array.isArray(j.state.picks)){
        var cloudTs=j.ts||0, localTs=(state&&state.__ts)||0;
        if(cloudTs>localTs){ state=Object.assign(defaultState(), j.state); state.__ts=cloudTs; saveLocalOnly(); render(); syncStatus("synced ✓ "+new Date().toLocaleTimeString()); }
        else if(localTs>cloudTs){ cloudPush(); }
        else { syncStatus("synced ✓"); }
      } else { syncStatus("linked ✓ (nothing saved yet)"); if((state.picks||[]).length) cloudPush(); }
    })
    .catch(function(){ syncStatus("offline"); });
}

// derived pick views (source depends on mode: assistant = saved real draft; mock = in-memory sim)
let mode = (function(){try{return localStorage.getItem("draft_mode")||"assistant";}catch(e){return "assistant";}})();
const mock = { active:false, complete:false, teams:0, rounds:0, myTeam:0, order:[], ptr:0, rosters:[], picks:[], log:[], teamByRank:{}, grades:null };
function mockOn(){ return mode==="mock" && mock.active && !mock.complete; }
function currentPicks(){ return mode==="mock" ? mock.picks : state.picks; }
function mineRanks(){ return currentPicks().filter(x=>x.m).map(x=>x.r); }
function takenSet(){ return new Set(currentPicks().map(x=>x.r)); }
function available(){ const t=takenSet(); return L.players.filter(p=>!t.has(p.rank)); }

// ---- Tiers (client-side, per position, from fps gaps) ----
function computeTiers(){
  const byPos={};
  L.players.forEach(p=>{ (byPos[p.pos]=byPos[p.pos]||[]).push(p); });
  Object.keys(byPos).forEach(pos=>{
    const arr=byPos[pos].sort((a,b)=>b.fps-a.fps);
    const gaps=[]; for(let i=0;i<arr.length-1;i++) gaps.push(arr[i].fps-arr[i+1].fps);
    const sorted=gaps.slice().sort((a,b)=>a-b); const med=sorted.length?sorted[Math.floor(sorted.length/2)]:0;
    const floor=(L.tierGap&&L.tierGap[pos])||10;
    let tier=1; arr[0]._tier=1;
    for(let i=1;i<arr.length;i++){
      const gap=arr[i-1].fps-arr[i].fps;
      if(gap>=Math.max(floor,1.6*med)) tier++;
      arr[i]._tier=tier;
    }
  });
}

// ---- Roster math ----
function rosterCounts(){ const c={}; L.positions.forEach(p=>c[p]=0); mineRanks().forEach(rk=>{const p=P[rk]; if(p&&c[p.pos]!==undefined)c[p.pos]++;}); return c; }
function slotsFilled(){
  const c=rosterCounts(),R=L.req,f={};
  ["QB","RB","WR","TE","K","DST"].forEach(pos=>{ if(R[pos]) f[pos]=Math.min(c[pos]||0,R[pos]); });
  let flexPool=0; L.flex.forEach(pos=>{ flexPool+=(c[pos]||0)-(f[pos]||0); });
  if(R.FLEX) f.FLEX=Math.min(flexPool,R.FLEX);
  return f;
}
function need(pos){ const c=rosterCounts(); return Math.max(0,(L.req[pos]||0)-(c[pos]||0)); }
function flexOpen(){ const f=slotsFilled(); return (L.req.FLEX||0)-(f.FLEX||0); }
function canUse(pos){ return need(pos)>0 || (L.flex.includes(pos)&&flexOpen()>0); }
function totalRosterSpots(){ return Object.values(L.req).reduce((a,b)=>a+b,0); }
function spotsLeft(){ return totalRosterSpots()-mineRanks().length; }

// ---- Snake pick math (mock-aware) ----
function pickForRound(r){ const t=state.teams,s=state.slot; return (r%2===1)?(r-1)*t+s:(r-1)*t+(t-s+1); }
function myUpcomingOveralls(){ const a=[]; for(let i=mock.ptr;i<mock.order.length;i++){ if(mock.order[i]===mock.myTeam) a.push(i+1); } return a; }
function myNextPickNo(){ if(mockOn()){ const u=myUpcomingOveralls(); const pk=u[0]||(mock.order.length+1); return {round:Math.ceil(pk/mock.teams),pick:pk}; } const round=mineRanks().length+1; return {round,pick:pickForRound(round)}; }
function myFollowingPick(){ if(mockOn()){ const u=myUpcomingOveralls(); return u[1]||(mock.order.length+1); } return pickForRound(mineRanks().length+2); }

// ---- Decision core: marginal starting value (VORP) + scarcity (VONA) ----
// Every pick is scored by how much it raises YOUR best starting lineup (in VORP),
// plus a scarcity premium if that position falls off before your next pick.
let MSV={}, VORPBASE=0, MSV_KEY="";
function prepDecision(){
  const key=L.key+":"+mode+":"+currentPicks().length+":"+mineRanks().length;
  if(key===MSV_KEY) return;
  VORPBASE=optimalLineup(mineRanks()).vorp; const base=VORPBASE; MSV={};
  const mine=mineRanks();
  available().forEach(p=>{ MSV[p.rank]=optimalLineup(mine.concat(p.rank)).vorp - base; });
  MSV_KEY=key;
}
function msvOf(p){ let m=MSV[p.rank]; if(m===undefined) m=optimalLineup(mineRanks().concat(p.rank)).vorp-VORPBASE; return m; }
function bestAvailAtPos(pos){ const a=available().filter(p=>p.pos===pos); a.sort((x,y)=>x.rank-y.rank); return a[0]||null; }
function positionUrgency(pos){
  const av=available().filter(p=>p.pos===pos);
  if(!av.length) return {now:null,bestRank:null,drop:0};
  let best=av[0]; av.forEach(x=>{ if((MSV[x.rank]||0)>(MSV[best.rank]||0)) best=x; });
  const foll=myFollowingPick();
  let laterBest=0; av.forEach(x=>{ if((x.adp==null||x.adp>=foll-3) && (MSV[x.rank]||0)>laterBest) laterBest=MSV[x.rank]||0; });
  const bestNow=MSV[best.rank]||0;
  const nowSurvives=(best.adp==null||best.adp>=foll-3);
  const drop=nowSurvives?0:Math.max(0,bestNow-laterBest);
  return {now:best,bestRank:best.rank,drop};
}

// ---- Availability guidance ----
function availLabel(p){
  if(!p.adp) return "deep — will be there";
  const foll=myFollowingPick(), cur=myNextPickNo().pick;
  if(p.adp <= cur-2) return "going now (ADP "+p.adp+")";
  if(p.adp >= foll+8) return "safe to wait";
  if(p.adp >= foll) return "likely back next pick";
  return "coin-flip to return";
}

// ---- Scoring: the #1 result IS the best pick for your roster right now ----
function scorePlayer(p){
  const S=L.strat;
  const msv=msvOf(p);           // marginal VORP added to your best starting lineup
  let score=msv;
  // scarcity premium (VONA): the position's best option falls off before your next pick
  const u=positionUrgency(p.pos);
  if(u.bestRank===p.rank) score += u.drop*(S.urgencyMul||1);
  // once this pick no longer upgrades your starters, value bench by upside/depth
  if(msv<3){ score += p.vorp*0.12; p.tags.forEach(t=>{ if(t==="Boom/bust") score+=(S.upside||0); }); }
  // light risk/floor shading
  p.tags.forEach(t=>{ if(t==="Safe floor") score+=(S.floor||0)*0.5; if(t==="Injury/health risk") score+=(S.injury||0)*0.5; });
  // guillotine survival flavor
  if(S.earlyBye && p.bye && p.bye<=6) score+=S.earlyBye;
  if(S.byeStack && p.bye){ const same=mineRanks().map(r=>P[r]).filter(x=>x&&x.bye===p.bye).length; if(same>=1) score+=S.byeStack*same; }
  // K/DEF: never before the last 1-2 rounds
  if(S.kdefLast && (p.pos==="K"||p.pos==="DST")){ const cushion=(p.pos==="K")?2:3; if(spotsLeft()>(need(p.pos)>0?cushion:99)) score-=999; }
  // Mandatory-starter guard: never leave a required lineup slot (esp. QB in deep leagues) unfilled.
  { const left=mockOn()?(mock.rounds-mineRanks().length):spotsLeft();
    const reqNeed=["QB","RB","WR","TE"].reduce((a,ps)=>a+need(ps),0);
    if(reqNeed>0){ if(need(p.pos)>0) score+=240/Math.max(1,left-reqNeed+1); else if(left<=reqNeed) score-=1000; } }
  return score;
}
function recommendations(n){ prepDecision(); const av=available().slice(); av.forEach(p=>p._score=scorePlayer(p)); av.sort((a,b)=>b._score-a._score); return av.slice(0,n); }

function isCliff(p){ // last available in his tier at this position
  const same=available().filter(x=>x.pos===p.pos && x._tier===p._tier);
  return same.length<=1 && available().some(x=>x.pos===p.pos && x._tier===p._tier+1);
}
function marketSignal(p){ if(p.adp===null) return null; const d=p.adp-p.rank; if(d>=12) return "Value"; if(d<=-12) return "Reach"; return null; }

function whyText(p){
  const bits=[];
  if(p.pos==="K"||p.pos==="DST") bits.push(p.pos==="K"?"kicker — last round":"streamable D/ST");
  else bits.push(`VORP <b>${p.vorp.toFixed(1)}</b>`);
  if(p._tier) bits.push(`${p.pos} Tier ${p._tier}`);
  if(need(p.pos)>0) bits.push(`fills ${p.pos}`);
  else if(L.flex.includes(p.pos)&&flexOpen()>0) bits.push("FLEX");
  if(isCliff(p)) bits.push("⚠ tier cliff");
  const ms=marketSignal(p); if(ms) bits.push(ms==="Value"?"📈 falling value":"📉 ahead of ADP");
  return bits.join(" · ");
}

// ---- Actions ----
function draftMine(rk){ if(!takenSet().has(rk)){ state.picks.push({r:rk,m:true}); saveState(); render(); } }
function markGone(rk){ if(!takenSet().has(rk)){ state.picks.push({r:rk,m:false}); saveState(); render(); } }
function undo(rk){ state.picks=state.picks.filter(x=>x.r!==rk); saveState(); render(); }
function undoLast(){ state.picks.pop(); saveState(); render(); }
function resetDraft(){ if(confirm("Reset the "+L.tab+" draft?")){ state.picks=[]; saveState(); render(); } }

// ---- Render ----
function posPill(pos){ return `<span class="pill ${pos}">${pos}</span>`; }

function renderRec(){

    <div class="rec-player"><span class="nm">${p.name}</span> ${posPill(p.pos)}
      <span class="meta">${p.team} · Bye ${fmt(p.bye)} · ${p.posrk}${p._tier?` · T${p._tier}`:""} · ADP ${fmt(p.adp)}</span></div>

  // verdict ALWAYS justifies this exact pick (no contradicting "consider someone else")
  const u=positionUrgency(p.pos); const msv=Math.round(msvOf(p)); let cls="ok", msg;
  if(u.bestRank===p.rank && u.drop>=10){
    cls="now"; msg=`Take now — ${isCliff(p)?"last of "+p.pos+" Tier "+p._tier+"; ":""}${p.pos} falls off hard before your next pick (~${Math.round(u.drop)} pts of starting edge lost if you wait). Best pick on the board.`;
  } else if(msv>=3){
    cls="ok"; msg=`Best pick for your roster — adds ~+${msv} pts of starting-lineup value, more than any scarcer position returns right now.`;
  } else {
    cls="ok"; msg=`Best value left — your starters are set, so this is the top upside stash for your bench.`;
  }
  vEl.className="verdict "+cls; vEl.style.display="block"; vEl.textContent=msg;
}

function renderScarcity(){
  const box=document.getElementById("scarBox");

    const u=positionUrgency(pos); if(!u.now) return "";

    const lbl = u.drop<5?"deep":(u.drop>=12?"scarce":"thinning");
    return `<div class="scarrow" onclick="quickFilter('${pos}')">
      <span class="pos">${posPill(pos)}</span>

  }).join("");
  box.innerHTML=rows;

  const f=slotsFilled();
  document.getElementById("prioBox").innerHTML=L.order.map(pos=>{

}

function renderRunAlert(){

      <span><span class="lbl">Bye ${fmt(p.bye)}</span> <button class="minibtn undo" onclick="undo(${rk})">undo</button></span></div>`; }).join("");

function tagClass(t){ return (t==="Safe floor"||t==="Rushing-QB floor"||t==="Stream-friendly")?"safe":"risk"; }
function renderTable(){

function render(){ renderMockUI(); renderRunAlert(); renderRec(); renderScarcity(); renderAlts(); renderRoster(); renderTable(); }
function quickFilter(pos){ document.getElementById("posFilter").value=pos; renderTable(); }

// ---- Mock draft engine ----
function resetMockState(){ mock.active=false; mock.complete=false; mock.picks=[]; mock.rosters=[]; mock.log=[]; mock.order=[]; mock.ptr=0; mock.teamByRank={}; mock.grades=null; }
function mockRounds(){ return Math.min(totalRosterSpots(), Math.floor(L.players.length / L.teams)); }
function startMock(slot){
  resetMockState();
  mock.teams=L.teams; mock.myTeam=Math.max(0,Math.min(L.teams-1,(slot|0)-1));
  mock.rounds=mockRounds(); mock.rosters=Array.from({length:mock.teams},()=>[]);
  const order=[]; for(let r=0;r<mock.rounds;r++){ const seq=[...Array(mock.teams).keys()]; if(r%2===1) seq.reverse(); order.push(...seq); }
  mock.order=order; mock.ptr=0; mock.active=true; mock.complete=false;
  advanceMock();
}
function commitPick(team,rank){ mock.picks.push({r:rank,m:team===mock.myTeam,t:team}); mock.rosters[team].push(rank); mock.teamByRank[rank]=team; mock.ptr++; }
function countByPos(ranks){ const c={QB:0,RB:0,WR:0,TE:0,K:0,DST:0}; ranks.forEach(r=>{const p=P[r]; if(p&&c[p.pos]!==undefined)c[p.pos]++;}); return c; }
function allowedForTeam(p,cnt,spotsLeftTeam){
  const R=L.req;
  if(p.pos==="QB"&&cnt.QB>=2) return false;
  if(p.pos==="TE"&&cnt.TE>=2) return false;
  if(p.pos==="K"&&cnt.K>=(R.K||0)) return false;
  if(p.pos==="DST"&&cnt.DST>=(R.DST||0)) return false;
  if((p.pos==="K"||p.pos==="DST")&&spotsLeftTeam>2) return false;
  return true;
}
function mandatoryUnfilled(cnt){ const R=L.req; let n=0; ["QB","RB","WR","TE","K","DST"].forEach(pos=>{ if(R[pos]) n+=Math.max(0,R[pos]-(cnt[pos]||0)); }); return n; }
function wpick(arr){ if(!arr||!arr.length) return null; const w=[0.55,0.25,0.13,0.07]; const n=Math.min(arr.length,4); let r=Math.random(),t=0; for(let i=0;i<n;i++){ t+=w[i]; if(r<=t) return arr[i]; } return arr[n-1]; }
function aiSelect(team){
  const roster=mock.rosters[team]; const cnt=countByPos(roster); const R=L.req;
  const spotsLeftTeam=mock.rounds-roster.length;
  const avail=available();
  let cands=avail.map(p=>({p, adp:(p.adp!=null?p.adp:250+p.rank)}));
  const mUnf=mandatoryUnfilled(cnt);
  let forced=null;
  if(spotsLeftTeam<=mUnf){ forced=new Set(); ["QB","RB","WR","TE","K","DST"].forEach(pos=>{ if(R[pos]&&(cnt[pos]||0)<R[pos]) forced.add(pos); }); }
  let pool=cands.filter(c=>allowedForTeam(c.p,cnt,spotsLeftTeam) && (!forced||forced.has(c.p.pos)));
  if(pool.length===0) pool=cands.filter(c=>allowedForTeam(c.p,cnt,spotsLeftTeam));
  if(pool.length===0) pool=cands;
  pool.forEach(c=>{ const pp=c.p; let b=c.adp;
    if(["QB","RB","WR","TE","K","DST"].includes(pp.pos) && (cnt[pp.pos]||0)<(R[pp.pos]||0)) b-=5;
    if((pp.pos==="QB"||pp.pos==="TE") && (cnt[pp.pos]||0)>=1) b+=8;
    if((pp.pos==="RB"||pp.pos==="WR") && (cnt[pp.pos]||0)>=(R[pp.pos]||0)+3) b+=10;
    c.eff=b; });
  pool.sort((a,b)=>a.eff-b.eff);
  const top=pool.filter(c=>c.eff<=pool[0].eff+12).slice(0,4);
  const choice=wpick(top)||pool[0];
  commitPick(team,choice.p.rank);
}
function advanceMock(){
  while(mock.ptr<mock.order.length && mock.order[mock.ptr]!==mock.myTeam){ aiSelect(mock.order[mock.ptr]); }
  if(mock.ptr>=mock.order.length){ mock.complete=true; gradeMock(); }
  render();
}
function mockUserPick(rank){ if(!(mode==="mock"&&mock.active&&!mock.complete)) return; if(mock.order[mock.ptr]!==mock.myTeam) return; if(takenSet().has(rank)) return; commitPick(mock.myTeam,rank); advanceMock(); }
function newMock(){ resetMockState(); render(); }
function optimalLineup(ranks){
  const ps=ranks.map(r=>P[r]).filter(Boolean); const byPos={}; ps.forEach(p=>{(byPos[p.pos]=byPos[p.pos]||[]).push(p);});
  Object.values(byPos).forEach(a=>a.sort((x,y)=>y.fps-x.fps));
  const R=L.req; let pts=0,vorp=0; const used=new Set(); const starters=[];
  function take(pos,n){ const a=byPos[pos]||[]; let c=0; for(const p of a){ if(c>=n) break; if(!used.has(p.rank)){ used.add(p.rank); pts+=p.fps; vorp+=p.vorp; starters.push(p); c++; } } }
  take("QB",R.QB||0); take("RB",R.RB||0); take("WR",R.WR||0); take("TE",R.TE||0);
  let flexN=R.FLEX||0; const flexPool=[]; L.flex.forEach(pos=>(byPos[pos]||[]).forEach(p=>{ if(!used.has(p.rank)) flexPool.push(p); }));
  flexPool.sort((x,y)=>y.fps-x.fps); for(const p of flexPool){ if(flexN<=0) break; used.add(p.rank); pts+=p.fps; vorp+=p.vorp; starters.push(p); flexN--; }
  take("K",R.K||0); take("DST",R.DST||0);
  return {pts, vorp, starters};
}
function letterFor(z){ if(z>=1.3)return"A+"; if(z>=0.9)return"A"; if(z>=0.55)return"A-"; if(z>=0.25)return"B+"; if(z>=0)return"B"; if(z>=-0.25)return"B-"; if(z>=-0.55)return"C+"; if(z>=-0.9)return"C"; if(z>=-1.3)return"C-"; if(z>=-1.8)return"D"; return"F"; }
function buildNote(r){
  const grp={}; r.starters.forEach(p=>{ grp[p.pos]=(grp[p.pos]||0)+p.fps; });
  let best=null,worst=null; Object.keys(grp).forEach(pos=>{ if(best===null||grp[pos]>grp[best])best=pos; if(worst===null||grp[pos]<grp[worst])worst=pos; });
  const notes=[]; if(best)notes.push("strong "+best); if(worst&&worst!==best)notes.push("thin "+worst);
  if(L.strat.byeStack){ const byes={}; r.starters.forEach(p=>{ if(p.bye) byes[p.bye]=(byes[p.bye]||0)+1; }); const mx=Math.max(0,...Object.values(byes)); if(mx>=3) notes.push("bye cluster ("+mx+")"); }
  return notes.join(" · ");
}
function gradeMock(){
  const teams=mock.teams; const res=[];
  for(let t=0;t<teams;t++){ const lu=optimalLineup(mock.rosters[t]); res.push({team:t,pts:lu.pts,starters:lu.starters}); }
  const mean=res.reduce((a,b)=>a+b.pts,0)/teams;
  const sd=Math.sqrt(res.reduce((a,b)=>a+(b.pts-mean)*(b.pts-mean),0)/teams)||1;
  res.forEach(r=>{ r.z=(r.pts-mean)/sd; r.grade=letterFor(r.z); const s=r.starters.slice().sort((a,b)=>b.fps-a.fps); r.top=s.slice(0,3).map(p=>p.name); r.note=buildNote(r); });
  res.sort((a,b)=>b.pts-a.pts); res.forEach((r,i)=>r.place=i+1);
  mock.grades=res;
}
// ---- Mock UI ----
function renderMockUI(){
  const aB=document.getElementById("mAssist"), mB=document.getElementById("mMock");
  aB.classList.toggle("active",mode==="assistant"); mB.classList.toggle("active",mode==="mock");
  const setup=document.getElementById("mockBar"), clock=document.getElementById("clockBar"), results=document.getElementById("results");
  if(mode!=="mock"){ setup.style.display="none"; clock.style.display="none"; results.style.display="none"; return; }
  if(mock.complete){ setup.style.display="none"; clock.style.display="none"; results.style.display="block"; renderResults(); return; }
  results.style.display="none";
  if(!mock.active){ setup.style.display="flex"; clock.style.display="none"; document.getElementById("mockSlotMax").textContent="1–"+L.teams; return; }
  setup.style.display="none"; clock.style.display="block"; renderClock();
}
function renderClock(){
  const {round,pick}=myNextPickNo(); const inRound=((pick-1)%mock.teams)+1;
  let startIdx=0; for(let i=mock.picks.length-1;i>=0;i--){ if(mock.picks[i].t===mock.myTeam){ startIdx=i+1; break; } }
  const recent=mock.picks.slice(startIdx).map(x=>`T${x.t+1}→${P[x.r].name}`);
  document.getElementById("clockBar").innerHTML =
    `<b>You're on the clock</b> — Round ${round}, Pick ${round}.${String(inRound).padStart(2,"0")} (overall #${pick} of ${mock.order.length}). Pick from the recommendation or the board.`
    + (recent.length?`<div class="clocklog">Since your last pick: ${recent.join(" · ")}</div>`:"");
}
function renderResults(){
  const g=mock.grades; if(!g){ return; }
  const mine=g.find(r=>r.team===mock.myTeam);
  let html=`<h2>Draft grades — ${L.tab} (${mock.rounds} rounds)</h2><div class="gradegrid">`;
  html+=g.map(r=>{ const you=r.team===mock.myTeam; return `<div class="gradecard${you?" you":""}">
    <div class="gc-top"><span class="gc-place">#${r.place}</span><span class="gc-team">Team ${r.team+1}${you?" (You)":""}</span><span class="gc-grade">${r.grade}</span></div>
    <div class="gc-pts">${r.pts.toFixed(0)} proj starter pts</div>
    <div class="gc-top3">${r.top.join(", ")}</div>
    <div class="gc-note">${r.note||""}</div></div>`; }).join("");
  html+=`</div>`;
  if(mine){ html+=`<div class="mylineup"><b>Your starting lineup (${mine.grade}, #${mine.place} of ${mock.teams})</b><div class="lu">`
    + mine.starters.map(p=>`<span class="lup">${p.posrk} ${p.name} <small>${p.fps.toFixed(0)}</small></span>`).join("") + `</div></div>`; }
  html+=`<div style="margin-top:12px"><button class="btn" onclick="newMock()">New mock draft</button></div>`;
  document.getElementById("results").innerHTML=html;
}

function useLeague(key){
  L=LEAGUES[key]; setActiveKey(key);
  P={}; L.players.forEach(p=>P[p.rank]=p);
  computeTiers();
  loadState();
  document.getElementById("hTitle").textContent=L.title;

  document.getElementById("setSlot").value=state.slot;

  cloudPull();
}
function buildTabs(){
  const tabs=document.getElementById("tabs");
  tabs.innerHTML=Object.values(LEAGUES).map(lg=>`<div class="tab" data-key="${lg.key}">${lg.tab}<small>${lg.tabSub}</small></div>`).join("");

}

// ---- Cloud sync wiring ----
(function(){
  var codeEl=document.getElementById("syncCode");
  var saveBtn=document.getElementById("syncSaveBtn");
  var pullBtn=document.getElementById("syncPullBtn");
  if(codeEl) codeEl.value=syncCode();
  function link(){
    var c=(codeEl.value||"").trim();
    if(c.length<10){ syncStatus("code must be 10+ characters"); return; }
    try{localStorage.setItem("draft_sync_code",c);}catch(e){}
    syncStatus("linking…"); cloudPull();
  }
  if(saveBtn) saveBtn.addEventListener("click",link);
  if(codeEl) codeEl.addEventListener("keydown",function(e){ if(e.key==="Enter") link(); });
  if(pullBtn) pullBtn.addEventListener("click",function(){ if(!syncOn()){ syncStatus("enter a code first"); return;} cloudPull(); });
  window.addEventListener("focus",function(){ if(syncOn()) cloudPull(); });
  if(!syncOn()) syncStatus(syncCode()?"":"off — add a code to sync across devices");
})();
</script>
